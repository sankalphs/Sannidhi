name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Convex backend binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/convex
          key: ${{ runner.os }}-convex-backend-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-convex-backend-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start Convex backend
        run: |
          (echo n | bunx convex dev --typecheck disable > convex-dev.log 2>&1 &)
          # The port answers before `convex dev` writes .env.local and pushes
          # functions; wait for the push so `convex env set` has a deployment.
          for i in $(seq 1 90); do
            if grep -q "Convex functions ready" convex-dev.log; then break; fi
            sleep 2
          done
          grep -q "Convex functions ready" convex-dev.log || { cat convex-dev.log; exit 1; }
          bunx convex env set SESSION_SECRET local-dev-session-secret-0123456789
          bunx convex env set NEXT_PUBLIC_APP_URL http://localhost:3000
          bunx convex env set SANNIDHI_TEST_FIXTURES 1
          bunx convex env set SANNIDHI_OPERATOR_EMAILS ananya.iyer@sit.edu.in

      - name: Lint
        run: bun run lint

      - name: Generate Next types
        run: bunx next typegen

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Format check
        run: bun run format:check

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Load test fixtures
        run: bun run fixtures

      - name: E2E tests
        run: bun run test:e2e

      - name: Build
        run: bun run build
