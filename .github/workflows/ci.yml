name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Convex backend binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/convex
          key: ${{ runner.os }}-convex-backend-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-convex-backend-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start Convex backend
        run: |
          (echo n | bunx convex dev --typecheck disable > convex-dev.log 2>&1 &)
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3210 >/dev/null 2>&1; then break; fi
            sleep 2
          done
          bunx convex env set SESSION_SECRET local-dev-session-secret-0123456789
          bunx convex env set NEXT_PUBLIC_APP_URL http://localhost:3000
          bunx convex env set SANNIDHI_DEMO_MODE 1

      - name: Lint
        run: bun run lint

      - name: Generate Next types
        run: bunx next typegen

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Format check
        run: bun run format:check

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Seed demo data
        run: bun run seed

      - name: E2E tests
        run: bun run test:e2e

      - name: Build
        run: bun run build
