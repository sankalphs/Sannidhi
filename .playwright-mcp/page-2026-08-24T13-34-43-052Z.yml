        - generic [ref=f4e403]:
            - generic [ref=f4e404]:
                - paragraph [ref=f4e405]: Trust model
                - heading "Trust is earned per check-in." [level=2] [ref=f4e406]
                - paragraph [ref=f4e407]: Sannidhi never assumes a face, a phone, or a QR screenshot is enough on its own. Signals are fused, decisions are explained, and the evidence is kept.
            - generic [ref=f4e408]:
                - generic [ref=f4e409]:
                    - term [ref=f4e410]: Passkeys, not passwords
                    - definition [ref=f4e411]: Accounts activate with a passkey bound to the student's own device. Nothing to phish, nothing to share.
                - generic [ref=f4e412]:
                    - term [ref=f4e413]: Challenges that expire
                    - definition [ref=f4e414]: Session QRs rotate every few seconds behind single-use nonces. A screenshot from last week proves nothing.
                - generic [ref=f4e415]:
                    - term [ref=f4e416]: A ledger that remembers
                    - definition [ref=f4e417]: Every state change is hash-chained and append-only. Corrections link forward; history cannot be quietly rewritten.
                - generic [ref=f4e418]:
                    - term [ref=f4e419]: Verification in proportion
                    - definition [ref=f4e420]: Strong checks run only when risk demands them. Routine check-ins stay fast, and biometrics are opt-in with consent.
